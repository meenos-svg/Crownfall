name: Build Crownfall Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create .env from GitHub Secrets
        run: |
          cat << 'EOF' > .env
          SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Crownfall-latest.apk

      - name: Publish APK Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Crownfall Latest Build
          files: Crownfall-latest.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
